name: ExeDesktopApp

options:
  bundleIdPrefix: au.id.mcculloch
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

packages:
  Termini:
    url: https://github.com/arach/Termini.git
    revision: 5fe5375dc7742fc436a5c03583e17c9a64afb6e2

targets:
  ExeDesktopApp:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.id.mcculloch.ExeDesktopApp
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/ExeDesktopApp.entitlements
    dependencies:
      - package: Termini
